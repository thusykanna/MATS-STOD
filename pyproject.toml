[project]
name = "mats-stod"
version = "0.1.0"
description = "MATS-STOD: Multi-Agent Translation System for Sinhala-Tamil Official Documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "sacrebleu>=2.4",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    # The DAG translation condition is the only translation pipeline; it
    # orchestrates per-segment nodes over the discourse graph with LangGraph
    # and checkpoints progress to SQLite (see DECISIONS.md D25).
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.30"]

[project.scripts]
# main() wraps app() so expected conditions, such as a dry run finding
# uncached work, print a message rather than a stack trace.
mats-stod = "mats_stod.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mats_stod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option in a default is the framework's documented idiom, not a bug.
"src/mats_stod/cli.py" = ["B008"]
# Tests favour compact fixtures over line-length purity.
"tests/*" = ["E501", "E702"]
