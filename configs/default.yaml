# MATS-STOD default configuration.
# Every experiment condition is an overlay on this file (configs/experiments/).
run_name: default
seed: 12345

langs:
  source: si
  target: ta
  names:
    si: Sinhala
    ta: Tamil
    en: English

llm:
  provider: gemini          # gemini | openai_compat | fake
  backend: vertex           # vertex | ai_studio
  model: gemini-2.5-flash
  temperature: 0.0
  max_output_tokens: 4096
  timeout_s: 120.0
  max_retries: 3
  cache_path: .cache/llm_cache.sqlite
  use_cache: true
  project: null             # falls back to $GOOGLE_CLOUD_PROJECT
  location: us-central1     # falls back to $GOOGLE_CLOUD_LOCATION
  # USD per million tokens. VERIFY THESE against Google's current pricing page
  # before quoting any cost figure: they are the only source the ledger has,
  # and a model missing here is reported as unpriced rather than as free.
  prices_usd_per_mtok:
    gemini-2.5-flash: {input: 0.30, output: 2.50}
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40}
    gemini-2.5-pro: {input: 1.25, output: 10.00}
    fake: {input: 0.0, output: 0.0}

segmentation:
  segmenter: structural     # structural | graft
  min_segment_chars: 40
  max_segment_chars: 1200
  max_discourse_chars: 2048
  merge_short_blocks: true
  split_long_blocks: true
  atomic_types: [heading, list_item, table_cell, caption]
  prompt_version: discourse_v1
  boundary_tolerance_chars: 2
  sentences:
    terminators: [".", "?", "!", "।", "॥", "…"]
    abbreviations:
      ["කි.මී.", "අ.පො.ස.", "ව.ප.", "අංක.", "රු.",
       "எ.கா.", "கி.மீ.", "அ.பொ.த.", "எண்.", "ரூ.",
       "Dr.", "Mr.", "Mrs.", "Ms.", "No.", "Rs.", "etc."]
    min_sentence_chars: 2
    newline_break_max_chars: 120

graph:
  edge_inferrer: graft      # graft | predecessor | tfidf | none
  edge_types:
    [structural_parent, coreference, entity_introduction,
     term_definition, cross_reference, continuation, graft_dependency]
  max_parents: 4
  max_pairwise_calls_per_doc: 4000
  max_pair_distance: null   # null = faithful GRAFT (all earlier segments)
  tfidf_threshold: 0.8
  transitive_reduction: false
  prompt_version: edge_v1

translation:
  strategy: B1_isolated
  prompt_version: translate_v1
  domain_note: "Official government document. Formal register. Preserve numbers, dates and reference codes exactly."
  window_k: 3
  full_doc_token_limit: 12000
  chunk_token_size: 4000
  chars_per_token_estimate: 2.5
  context_token_budget: 2000
  dag_context_depth: 2
  retry_on_parse_failure: 1
  protect:
    enabled: true
    check_digits: true
    patterns:
      - '\d[\d,./-]*'
      - '[A-Z]{2,}(?:/[A-Z0-9]+)+'

evaluation:
  primary_metric: chrf++
  bleu_tokenize: none
  chrf_word_order: 2
  chrf_char_order: 6
  chrf_beta: 2
  bootstrap_resamples: 1000
  bootstrap_seed: 12345

paths:
  parallel: data/parallel
  samples: data/samples
  gold_segmentation: data/gold/segmentation
  gold_edges: data/gold/edges
  runs: runs
  split_file: data/splits.json
